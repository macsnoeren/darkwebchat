<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DARKNET – Operator Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-hacker-login">

  <div class="scanlines"></div>

  <div class="hacker-login-box">
    <div class="hacker-login-header">
      <h1>DARKNET OPERATORS</h1>
      <p>BEVEILIGD OPERATIONEEL SYSTEEM</p>
    </div>

    <div class="login-panel">
      <form id="hacker-login-form">
        <div class="form-group">
          <label class="form-label" for="hacker-username">GEBRUIKERSNAAM</label>
          <input type="text" id="hacker-username" class="form-input"
                 autocomplete="off" spellcheck="false" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="hacker-password">WACHTWOORD</label>
          <input type="password" id="hacker-password" class="form-input" required>
        </div>
        <div id="login-error" class="form-error"></div>
        <button type="submit" class="login-btn">TOEGANG VERKRIJGEN</button>
      </form>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // Check setup before loading the login form
    (function () {
      var s = io();
      s.on("connect", function () { s.emit("check-setup"); });
      s.on("setup-status", function (data) {
        if (data.needsSetup) window.location.href = "setup.html";
        else s.disconnect();
      });
    })();
  </script>
  <script src="hacker-app.js"></script>
</body>
</html>
